[project]
name = "easyquant"
version = "0.2.0"
description = "A 股 AI 工作台 — FastAPI + Vue3 SPA + APScheduler + Claude/Goose 驱动的盘前/盘中/盘后/夜间全时段决策面板"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18.40",
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "pandas>=2.2.3",
  "pyjwt>=2.8.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
