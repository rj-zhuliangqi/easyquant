[project]
name = "sector-fund-monitor"
version = "0.1.0"
description = "Minute-level sector fund flow monitor powered by AKShare"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18.40",
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "pandas>=2.2.3",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
