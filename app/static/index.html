<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>板块资金对比监控台</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>板块资金对比监控台</h1>
          <p id="status-text">正在加载监控状态...</p>
        </div>
        <div class="toolbar">
          <div class="tab-group" id="sector-tabs">
            <button class="tab-button active" data-sector-type="industry">行业板块</button>
            <button class="tab-button" data-sector-type="concept">概念板块</button>
          </div>
          <div class="control-group">
            <label for="granularity-select">周期</label>
            <select id="granularity-select">
              <option value="minute">分钟</option>
              <option value="day">天级</option>
            </select>
          </div>
          <div class="control-group hidden" id="trading-date-control">
            <label for="trading-date-select">交易日</label>
            <select id="trading-date-select"></select>
          </div>
          <div class="control-group" id="lookback-control">
            <label for="lookback-select">范围</label>
            <select id="lookback-select">
              <option value="1">1日</option>
              <option value="3">3日</option>
              <option value="5">5日</option>
              <option value="10">10日</option>
              <option value="20">20日</option>
              <option value="30">30日</option>
            </select>
          </div>
          <div class="control-group">
            <label for="metric-select">口径</label>
            <select id="metric-select">
              <option value="net_strength">净流入强度</option>
              <option value="net_amount">净流入绝对值</option>
            </select>
          </div>
          <div class="control-group">
            <label for="limit-select">Top N</label>
            <select id="limit-select">
              <option value="6">6</option>
              <option value="8" selected>8</option>
              <option value="12">12</option>
              <option value="20">20</option>
              <option value="0">全部</option>
            </select>
          </div>
          <button id="refresh-button" class="primary-button">立即采样</button>
        </div>
      </header>

      <section class="panel watchlist-panel">
        <div class="panel-header">
          <div>
            <h2>自选板块池</h2>
            <p>从行业或概念列表里直接选择，点击自选标签可快速切换。</p>
          </div>
        </div>
        <div class="watchlist-toolbar">
          <div class="control-group">
            <label for="watchlist-type-select">类型</label>
            <select id="watchlist-type-select">
              <option value="industry">行业板块</option>
              <option value="concept">概念板块</option>
            </select>
          </div>
          <div class="control-group watchlist-sector-picker">
            <label for="watchlist-sector-select">板块</label>
            <select id="watchlist-sector-select"></select>
          </div>
          <button id="watchlist-add-button" class="primary-button secondary-button">加入自选</button>
        </div>
        <div id="watchlist-chips" class="chip-list"></div>
      </section>

      <main class="dashboard-grid">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-header"><h2>资金流入榜</h2></div>
            <div id="leaders-list" class="rank-list"></div>
          </section>
          <section class="panel">
            <div class="panel-header"><h2>资金流出榜</h2></div>
            <div id="laggards-list" class="rank-list"></div>
          </section>
          <section class="panel">
            <div class="panel-header"><h2>板块异动告警</h2></div>
            <div id="alerts-list" class="rank-list"></div>
          </section>
          <section class="panel">
            <div class="panel-header"><h2>告警参数</h2></div>
            <div class="settings-grid">
              <label>
                <span>强度变化阈值(%)</span>
                <input id="delta-threshold-input" type="number" min="0" step="0.1" value="1.5" />
              </label>
              <label>
                <span>排名跃迁阈值</span>
                <input id="rank-threshold-input" type="number" min="0" step="1" value="2" />
              </label>
            </div>
          </section>
        </aside>

        <section class="content">
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2 id="comparison-title">全板块净流入强度对比</h2>
                <p id="comparison-subtitle">默认展示最新 Top N 板块</p>
              </div>
              <div id="comparison-badges" class="detail-badges"></div>
            </div>
            <div id="comparison-chart" class="chart large-chart"></div>
          </section>

          <section class="detail-layout">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 id="detail-title">板块详情</h2>
                  <p id="detail-subtitle">点击榜单中的板块查看详细历史</p>
                </div>
              </div>
              <dl id="sector-detail" class="detail-grid"></dl>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 id="history-title">板块历史曲线</h2>
                  <p id="history-subtitle">显示选中板块的分钟/天级历史</p>
                </div>
              </div>
              <div id="detail-chart" class="chart small-chart"></div>
            </section>
          </section>

          <section class="tables-layout">
            <section class="panel">
              <div class="panel-header"><h2>板块成分股资金流</h2></div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>代码</th>
                      <th>名称</th>
                      <th>最新价</th>
                      <th>今日涨跌幅</th>
                      <th>主力净流入</th>
                    </tr>
                  </thead>
                  <tbody id="sector-stocks-body"></tbody>
                </table>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header"><h2>个股实时资金榜</h2></div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>代码</th>
                      <th>名称</th>
                      <th>最新价</th>
                      <th>涨跌幅</th>
                      <th>净额</th>
                    </tr>
                  </thead>
                  <tbody id="individual-body"></tbody>
                </table>
              </div>
            </section>
          </section>
        </section>
      </main>
    </div>
    <script src="/static/app.js?v=20260508-3"></script>
  </body>
</html>
